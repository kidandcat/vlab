<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vlab</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f4f6f8; font: 14px system-ui, sans-serif; color: #1a1a1a; }
    main { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; padding: 24px; }
    canvas { width: 480px; height: 360px; max-width: 100%; outline: none; touch-action: none;
             box-shadow: 0 2px 12px rgb(0 0 0 / 0.15); background: white; }
    #panel { width: min(420px, 100%); display: flex; flex-direction: column; gap: 8px; }
    textarea, pre { font: 12px ui-monospace, monospace; }
    textarea { min-height: 88px; }
    pre { white-space: pre-wrap; background: white; padding: 8px; min-height: 72px; }
    #status { color: #555; }
  </style>
</head>
<body>
  <main>
    <div>
      <canvas id="app" tabindex="0"></canvas>
      <div id="status">cargando…</div>
    </div>
    <form id="panel">
      <strong>Sandbox en el servidor</strong>
      <textarea id="spec">fuel 1000
memory 131072
calls 4
fs-read</textarea>
      <button type="button" id="mk">crear</button>
      <button type="button" id="add">ejemplo add</button>
      <button type="button" id="oob">ejemplo oob</button>
      <button type="button" id="rm">destruir</button>
      <pre id="out">sin sandbox</pre>
    </form>
  </main>
  <script src="uvl.js"></script>
  <script type="module">
    import { startUVL } from './uvl-web.js';
    const status = document.getElementById('status');
    try {
      const params = new URLSearchParams(location.search);
      const backend = params.get('backend');
      const size = params.get('size')?.match(/^(\d+)x(\d+)$/);
      const canvas = document.getElementById('app');
      if (size) { canvas.style.width = `${size[1]}px`; canvas.style.height = `${size[2]}px`; }
      window.uvl = await startUVL(canvas, createUVL, { backend });
      status.textContent = `vlab · Lean → WebAssembly · ${window.uvl.state.backend}`;
      let id = '';
      const out = document.getElementById('out');
      const spec = document.getElementById('spec');
      async function api(method, path, body) {
        const res = await fetch(path, { method, body });
        const text = await res.text();
        out.textContent = `${res.status} ${text}`;
        return text;
      }
      document.getElementById('mk').onclick = async () => {
        const text = await api('POST', '/api/sandboxes', spec.value);
        try { id = JSON.parse(text).id || id; } catch (_) {}
      };
      document.getElementById('add').onclick = () => id && api('POST', `/api/sandboxes/${id}/exec`, 'example add');
      document.getElementById('oob').onclick = () => id && api('POST', `/api/sandboxes/${id}/exec`, 'example oob');
      document.getElementById('rm').onclick = async () => { if (id) { await api('DELETE', `/api/sandboxes/${id}`); id = ''; } };
    } catch (e) {
      status.textContent = `error: ${e.message}`;
      throw e;
    }
  </script>
</body>
</html>
